<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Creative Nest by Diya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #F5F0EB; color: #1A1A1A; }
    .gold-btn { background-color: #C9A87C; color: white; transition: all 0.2s; }
    .gold-btn:hover { background-color: #b59266; transform: translateY(-1px); }
  </style>
</head>
<body class="min-h-screen p-6 sm:p-12">
  <div class="max-w-6xl mx-auto">
    <!-- Header -->
    <header class="flex flex-col sm:flex-row justify-between items-center mb-10 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
      <div>
        <h1 class="text-3xl font-bold">Store Admin</h1>
        <p class="text-gray-500 text-sm mt-1">Creative Nest by Diya</p>
      </div>
      <button onclick="publishToLive()" id="publishBtn" class="mt-4 sm:mt-0 gold-btn px-6 py-3 rounded-xl font-semibold shadow-sm flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
        </svg>
        🚀 Publish to Live Website
      </button>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Left Column: Add Product Form -->
      <div class="lg:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
        <h2 class="text-xl font-bold mb-6">➕ Add New Product</h2>
        
        <form id="addProductForm" class="space-y-4" onsubmit="handleAddProduct(event)">
          <!-- Name -->
          <div>
            <label class="block text-sm font-semibold mb-1">Product Name *</label>
            <input type="text" id="name" required class="w-full p-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#C9A87C]" placeholder="e.g. Memory Frame">
          </div>
          
          <!-- Category -->
          <div>
            <label class="block text-sm font-semibold mb-1">Category *</label>
            <select id="category" required class="w-full p-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#C9A87C]">
              <!-- Loaded dynamically -->
            </select>
          </div>

          <!-- Price -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold mb-1">Price (₹) *</label>
              <input type="number" id="price" required min="1" class="w-full p-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#C9A87C]">
            </div>
            <div>
              <label class="block text-sm font-semibold mb-1">Original Price (₹)</label>
              <input type="number" id="originalPrice" min="1" placeholder="Optional" class="w-full p-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#C9A87C]">
            </div>
          </div>

          <!-- Image Gallery Upload -->
          <div>
            <label class="block text-sm font-semibold mb-1">Product Images</label>
            
            <!-- Image Gallery (Thumbnails) -->
            <div id="imageGalleryContainer" class="hidden mb-3 p-3 bg-gray-50 rounded-lg border border-gray-200">
              <p class="text-xs text-gray-500 mb-2 uppercase tracking-wider font-semibold">Current Gallery</p>
              <div id="imageGalleryGrid" class="flex flex-wrap gap-3">
                <!-- Rendered via JS -->
              </div>
            </div>

            <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-lg hover:border-[#C9A87C] transition-colors bg-gray-50">
              <div class="space-y-1 text-center">
                <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                  <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <div class="flex text-sm text-gray-600 justify-center">
                  <label for="imageUpload" class="relative cursor-pointer bg-white rounded-md font-medium text-[#C9A87C] hover:text-[#b09065] focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-[#C9A87C]">
                    <span>Upload a file</span>
                    <input id="imageUpload" name="imageUpload" type="file" class="sr-only" accept="image/jpeg, image/png">
                  </label>
                </div>
                <p class="text-xs text-gray-500" id="fileNameDisplay">Drag and drop or click to add image</p>
              </div>
            </div>

            <!-- Cropper Section (Hidden by default) -->
            <div id="cropSection" class="hidden mt-3 p-3 bg-white rounded-lg border border-gray-200 shadow-inner">
              <p class="text-xs font-semibold mb-2 text-gray-700 uppercase tracking-wider">Adjust Image (Square Crop)</p>
              <div class="w-full h-64 bg-gray-100 rounded border border-gray-300 overflow-hidden relative">
                <img id="cropImage" src="" class="block max-w-full">
              </div>
              <div class="mt-3 flex justify-end gap-2">
                <button type="button" onclick="cancelCrop()" class="px-3 py-1.5 text-xs bg-gray-200 text-gray-700 rounded font-semibold hover:bg-gray-300 transition-colors">Cancel</button>
                <button type="button" id="applyCropBtn" onclick="applyCrop()" class="px-3 py-1.5 text-xs bg-[#C9A87C] text-white rounded font-semibold hover:bg-[#b09065] transition-colors">Upload & Add to Gallery</button>
              </div>
            </div>

          </div>

          <!-- Description -->
          <div>
            <label class="block text-sm font-semibold mb-1">Description</label>
            <textarea id="description" rows="3" class="w-full p-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#C9A87C]"></textarea>
          </div>

          <!-- Options -->
          <div class="flex gap-6 pt-2">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" id="inStock" checked class="w-5 h-5 text-[#C9A87C] rounded focus:ring-[#C9A87C]">
              <span class="text-sm font-semibold">In Stock</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" id="featured" checked class="w-5 h-5 text-[#C9A87C] rounded focus:ring-[#C9A87C]">
              <span class="text-sm font-semibold">Featured</span>
            </label>
                 <!-- Submit -->
          <div class="flex gap-2 mt-4">
            <button type="button" id="cancelEditBtn" onclick="cancelEdit()" class="hidden w-1/3 bg-gray-200 text-gray-800 font-semibold py-3 rounded-xl hover:bg-gray-300 transition-colors">
              Cancel
            </button>
            <button type="submit" id="submitBtn" class="flex-1 bg-gray-900 text-white font-semibold py-3 rounded-xl hover:bg-gray-800 transition-colors">
              Add Product
            </button>
          </div>
        </form>
      </div>

      <!-- Right Column: Products List -->
      <div class="lg:col-span-2">
        <h2 class="text-xl font-bold mb-6">📦 Your Products</h2>
        <div id="productsList" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Rendered via JS -->
          <div class="col-span-full text-center py-10 text-gray-500">Loading products...</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    let categories = [];
    let products = [];
    let editingId = null;

    // Initialize
    async function loadData() {
      const res = await fetch('/api/data');
      const data = await res.json();
      categories = data.categories;
      products = data.products.reverse(); // Show newest first
      
      // Populate category dropdown
      const catSelect = document.getElementById('category');
      catSelect.innerHTML = categories.map(c => `<option value="${c.slug}">${c.name}</option>`).join('');
      
      renderProducts();
    }

    // Render products list
    function renderProducts() {
      const list = document.getElementById('productsList');
      if (products.length === 0) {
        list.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500 bg-white rounded-2xl">No products yet. Add your first one!</div>`;
        return;
      }
      
      list.innerHTML = products.map(p => `
        <div class="bg-white rounded-2xl p-4 shadow-sm border ${editingId === p.id ? 'border-[#C9A87C] ring-1 ring-[#C9A87C]' : 'border-gray-100'} flex gap-4 items-center transition-all">
          <div class="w-20 h-20 bg-gray-100 rounded-xl flex-shrink-0 overflow-hidden flex items-center justify-center">
            ${p.images && p.images[0] ? `<img src="${p.images[0]}" class="w-full h-full object-cover">` : '📸'}
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="font-bold text-gray-900 truncate">${p.name}</h3>
            <p class="text-sm text-gray-500">₹${p.price.toLocaleString('en-IN')} • ${categories.find(c => c.slug === p.category)?.name}</p>
            <div class="mt-2 flex flex-wrap gap-2">
              <button onclick="toggleStock('${p.id}')" class="text-xs px-2 py-1 rounded-md font-semibold ${p.inStock ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'} hover:opacity-80 transition-opacity">
                ${p.inStock ? 'In Stock' : 'Sold Out'}
              </button>
              <button onclick="startEdit('${p.id}')" class="text-xs px-2 py-1 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-md font-semibold transition-colors">
                Edit
              </button>
              <button onclick="deleteProduct('${p.id}')" class="text-xs px-2 py-1 bg-gray-50 hover:bg-red-100 hover:text-red-600 text-gray-600 rounded-md font-semibold transition-colors">
                Delete
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Handle File Input Change (Cropper)
    let cropper = null;
    let pendingImages = [];

    function renderGallery() {
      const container = document.getElementById('imageGalleryContainer');
      const grid = document.getElementById('imageGalleryGrid');
      
      if (pendingImages.length === 0) {
        container.classList.add('hidden');
        grid.innerHTML = '';
        return;
      }
      
      container.classList.remove('hidden');
      grid.innerHTML = pendingImages.map((img, idx) => `
        <div class="relative w-16 h-16 rounded-lg overflow-hidden border border-gray-300">
          <img src="${img}" class="w-full h-full object-cover">
          <button type="button" onclick="removeImage(${idx})" class="absolute top-0.5 right-0.5 bg-red-500 text-white rounded-full p-0.5 hover:bg-red-600 shadow-sm" title="Remove image">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
      `).join('');
    }

    function removeImage(idx) {
      pendingImages.splice(idx, 1);
      renderGallery();
    }

    document.getElementById('imageUpload').addEventListener('change', function(e) {
      if (e.target.files.length > 0) {
        const file = e.target.files[0];
        if (!file.type.startsWith('image/')) {
          alert('Please select an image file (JPEG/PNG)');
          return;
        }

        const reader = new FileReader();
        reader.onload = function(event) {
          document.getElementById('cropImage').src = event.target.result;
          document.getElementById('cropSection').classList.remove('hidden');
          document.getElementById('fileNameDisplay').innerText = "Crop your image below";
          if (cropper) cropper.destroy();
          const imgElement = document.getElementById('cropImage');
          cropper = new Cropper(imgElement, { aspectRatio: 1, viewMode: 1, autoCropArea: 1, background: false });
        };
        reader.readAsDataURL(file);
      }
    });

    async function applyCrop() {
      if (!cropper) return;
      const btn = document.getElementById('applyCropBtn');
      const originalText = btn.innerText;
      btn.innerText = 'Uploading...';
      btn.disabled = true;

      cropper.getCroppedCanvas({ width: 800, height: 800, fillColor: '#fff' }).toBlob(async (blob) => {
        try {
          const formData = new FormData();
          formData.append('image', blob, 'gallery-image.jpg');
          const uploadRes = await fetch('/api/upload', { method: 'POST', body: formData });
          const uploadData = await uploadRes.json();
          pendingImages.push(uploadData.url);
          
          document.getElementById('cropSection').classList.add('hidden');
          document.getElementById('fileNameDisplay').innerText = "✅ Added! Add another if you like.";
          if (cropper) { cropper.destroy(); cropper = null; }
          renderGallery();
        } catch(err) {
          alert('Upload failed: ' + err.message);
        } finally {
          btn.innerText = originalText;
          btn.disabled = false;
        }
      }, 'image/jpeg', 0.9);
    }

    function cancelCrop() {
      document.getElementById('cropSection').classList.add('hidden');
      document.getElementById('imageUpload').value = '';
      document.getElementById('fileNameDisplay').innerText = "Drag and drop or click to add image";
      if (cropper) { cropper.destroy(); cropper = null; }
    }
    
    // Start Editing
    function startEdit(id) {
      const p = products.find(prod => prod.id === id);
      if (!p) return;
      
      editingId = id;
      document.getElementById('name').value = p.name;
      document.getElementById('price').value = p.price;
      document.getElementById('originalPrice').value = p.originalPrice || '';
      document.getElementById('category').value = p.category;
      document.getElementById('description').value = p.description || '';
      document.getElementById('inStock').checked = p.inStock;
      document.getElementById('featured').checked = p.featured;
      
      pendingImages = p.images ? [...p.images] : [];
      renderGallery();
      document.getElementById('fileNameDisplay').innerText = 'Drag and drop or click to add more images';
        
      document.getElementById('submitBtn').innerText = 'Update Product';
      document.getElementById('cancelEditBtn').classList.remove('hidden');
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderProducts(); // Update highlight
    }
    
    // Cancel Editing
    function cancelEdit() {
      editingId = null;
      pendingImages = [];
      document.getElementById('addProductForm').reset();
      cancelCrop(); 
      document.getElementById('fileNameDisplay').innerText = 'Drag and drop or click to add image';
      document.getElementById('submitBtn').innerText = 'Add Product';
      document.getElementById('cancelEditBtn').classList.add('hidden');
      renderGallery();
      renderProducts();
    }

    // Add or Update Product
    async function handleAddProduct(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const isUpdating = editingId !== null;
      btn.innerText = isUpdating ? 'Updating...' : 'Adding...';
      btn.disabled = true;

      try {
        const payload = {
          name: document.getElementById('name').value,
          price: parseInt(document.getElementById('price').value),
          originalPrice: document.getElementById('originalPrice').value ? parseInt(document.getElementById('originalPrice').value) : null,
          category: document.getElementById('category').value,
          description: document.getElementById('description').value,
          inStock: document.getElementById('inStock').checked,
          featured: document.getElementById('featured').checked,
          tags: [],
          images: pendingImages
        };

        const url = isUpdating ? `/api/products/${editingId}` : '/api/products';
        const method = isUpdating ? 'PUT' : 'POST';

        await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        cancelEdit(); // Reset form and reload
        await loadData();
      } catch (err) {
        alert('Error saving product: ' + err.message);
      } finally {
        btn.disabled = false;
        if (!editingId) btn.innerText = 'Add Product';
      }
    }

    // Toggle Stock
    async function toggleStock(id) {
      await fetch(`/api/products/${id}/stock`, { method: 'PATCH' });
      loadData();
    }

    // Delete Product
    async function deleteProduct(id) {
      if(confirm('Are you sure you want to delete this product?')) {
        await fetch(`/api/products/${id}`, { method: 'DELETE' });
        loadData();
      }
    }

    // Publish to Live
    async function publishToLive() {
      const btn = document.getElementById('publishBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = '⏳ Publishing...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/publish', { method: 'POST' });
        if (res.ok) {
          btn.innerHTML = '✅ Published! Live in 2 mins';
          setTimeout(() => { btn.innerHTML = originalText; btn.disabled = false; }, 4000);
        } else {
          throw new Error('Failed to publish');
        }
      } catch (err) {
        alert('Error publishing to GitHub. Check terminal for details.');
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    // Start
    loadData();
  </script>
</body>
</html>
